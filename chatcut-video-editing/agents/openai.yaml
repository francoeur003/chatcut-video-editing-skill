  short_description: "用 ChatCut 完成可编辑口播剪辑、字幕、特效与导出"
  default_prompt: "Use $chatcut-video-editing to turn local video clips into an editable ChatCut cut with tightened pauses, captions, light effects, verification, and export when requested."

dependencies:
